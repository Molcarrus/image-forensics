[package]
name = "image-forensics"
version = "0.1.0"
edition = "2024"

[dependencies]
image = "0.25.9"
imageproc = "0.25.0"
kamadak-exif = "0.6.1"
ndarray = "0.17.1"
rayon = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"

# Removed as unreferenced: `ndarray-linalg` (which also drags in a BLAS/LAPACK
# backend and is a common source of Windows build failures), `ndarray-stats`,
# `statrs`, `parking_lot`, `log`, and the `criterion`/`tempfile` dev-deps.
# `num-complex` and `rustfft` went with the copy-move rewrite, which now uses a
# real separable DCT instead of a 1-D FFT over a flattened block.
